for(let i=0;i<100;i++){

for(let i=0;i<150;i++){

 profiles.push({name:n,age,loc,race,gender:"men",online,img});
}

function render(list){
 grid.innerHTML="";
 list.forEach(p=>{
   let d=document.createElement('div');
   d.className='card'; d.dataset.gender=p.gender; d.dataset.race=p.race.toLowerCase(); d.dataset.online=p.online; d.dataset.loc=p.loc.toLowerCase();

   grid.appendChild(d);
 });
}
render(profiles);
function filterP(t){
 document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));
 document.getElementById('b-'+t)?.classList.add('active');
 if(t==='all') render(profiles);
 else if(t==='women') render(profiles.filter(p=>p.gender==='women'));
 else if(t==='men') render(profiles.filter(p=>p.gender==='men'));
 else if(t==='online') render(profiles.filter(p=>p.online));
 else if(t==='black') render(profiles.filter(p=>p.race==='Black'));
 else if(t==='white') render(profiles.filter(p=>p.race==='White'));
 else if(t==='nakuru') render(profiles.filter(p=>p.loc.toLowerCase().includes('nakuru')||p.loc.toLowerCase().includes('lanet')||p.loc.toLowerCase().includes('njoro')||p.loc.toLowerCase().includes('bahati')));
}
